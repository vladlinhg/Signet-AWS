services:
  web:
    build: .
    # Override CMD to use gunicorn with RELOAD for local development
    # This matches the production server (Gunicorn) but enables dev features (Reload)
    command: sh -c "python manage.py migrate && python manage.py import_erp_data --users-only && gunicorn --bind 0.0.0.0:8000 --reload config.wsgi:application"
    volumes:
      - ./src:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev_secret_key
      # If we switch to Postgres later, we add DB env vars here
