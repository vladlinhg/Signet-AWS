services:
  web:
    build: .
    # Production Command: No reload, verified workers
    command: sh -c "python manage.py migrate && python manage.py import_erp_data && gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    restart: always
    volumes:
      # In production, we ONLY mount data/static, NOT the code (code is built into image)
      - ./data:/data
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Fallbacks if .env is missing (though .env is preferred)
      - DEBUG=0
